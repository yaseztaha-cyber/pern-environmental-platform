      rel="stylesheet"
    />
    <style>
      /* Instant boot splash — shown while the single-file bundle parses,
         auto-removed when React mounts. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #020617;
        color: #f8fafc;
        font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      #splash .sp-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: none;
      }
      #splash .sp-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(0, 212, 170, 0.35);
        background: linear-gradient(160deg, rgba(0, 212, 170, 0.25), rgba(14, 165, 233, 0.08));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 0 24px -6px rgba(0, 212, 170, 0.7);
      }
      #splash .sp-bar {
        width: 170px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      #splash .sp-bar::before {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #00d4aa, #22d3ee);
        animation: sp-load 1.1s ease-in-out infinite;
      }
      #splash .sp-sub {
        font-size: 10px;
        color: #94a3b8;
      }
      @keyframes sp-load {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(290%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-bar::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" aria-hidden="true">
        <div class="sp-logo">
          <span class="sp-mark"></span>
          PERN
        </div>
        <div class="sp-bar"></div>
        <div class="sp-sub">Predictive Environmental Risk Network</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
