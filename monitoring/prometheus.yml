# Prometheus Configuration for PERN Enterprise
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'pern-backend'
    static_configs:
      - targets: ['pern-backend:3000']
    metrics_path: '/metrics'

  - job_name: 'pern-frontend'
    static_configs:
      - targets: ['pern-frontend:80']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']