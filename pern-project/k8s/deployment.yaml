# PERN Enterprise - Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pern-frontend
  labels:
    app: pern
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pern-frontend
  template:
    metadata:
      labels:
        app: pern-frontend
    spec:
      containers:
      - name: pern-frontend
        image: pern/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_LOGTO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: pern-secrets
              key: logto-endpoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pern-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pern-backend
  template:
    metadata:
      labels:
        app: pern-backend
    spec:
      containers:
      - name: pern-backend
        image: pern/backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pern-secrets
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: pern-frontend-service
spec:
  selector:
    app: pern-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: pern-backend-service
spec:
  selector:
    app: pern-backend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP