services:
  frontend:
    build: ./pern-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pern-network

  backend:
    build: ./pern-backend
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8081:8081"
    environment:
      - NTFY_TOPIC=pern-platform-alerts-2026
    depends_on:
      - postgres
      - mqtt-broker
    networks:
      - pern-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pern
      POSTGRES_PASSWORD: pern_secret
      POSTGRES_DB: pern_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pern-network

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - pern-network

  logto:
    image: svhd/logto:latest
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - DB_URL=postgresql://pern:pern_secret@postgres:5432/logto
      - ENDPOINT=http://localhost:3001
    depends_on:
      - postgres
    networks:
      - pern-network

volumes:
  postgres-data:

networks:
  pern-network:
    driver: bridge